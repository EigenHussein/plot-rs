[package]
name = "plotters"
version = "0.1.0"
edition = "2021"

[dependencies]
assimp = "0.3.1"
gl = "0.14.0"
glfw = "0.57.0"
glm = "0.2.3"
image = "0.25.1"
nalgebra-glm = "0.18.0"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"

plot-rs = {path = "plot-rs"}
typed-builder = "0.19.1"

[target.'cfg(target_os = "windows")'.dependencies]
freetype-sys = {version="0.21.0", features = ["bundled"] }
freetype-rs = "0.37.0"


[target.'cfg(target_os = "linux")'.dependencies]
freetype-rs = "0.37.0"


[[bin]]

name = "main"
path = "src/main.rs"


[[bin]]

name = "freetype"
path = "src/freetype_test.rs"


[[bin]]

name = "texture_example"
path = "src/texture_example.rs"


[[bin]]

name = "shapes"
path = "src/shapes_example.rs"

[[bin]]
name = "hdr"
path = "src/hdr_test.rs"


[[bin]]
name = "text_generator"
path = "src/text_texture_generator.rs"


[[bin]]
name = "features"
path = "src/features_testing.rs"


[[bin]]

name = "dynamic_text"
path = "src/dynamic_text_using_atlas.rs"